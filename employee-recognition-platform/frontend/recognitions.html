<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Recognition Feed - RecognitionHub</title>
</head>
<body data-page="recognitions">
  <div id="navbar-container"></div>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 d-none d-md-block sidebar" id="sidebar-container"></aside>
      <main class="col-md-9 col-lg-10 p-3 p-md-4">
        <div id="alertBox"></div>
        <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
          <h3 class="fw-bold mb-0">Recognition Feed</h3>
          <div class="d-flex gap-2">
            <select id="categoryFilter" class="form-select"><option value="">All categories</option></select>
            <a href="give-recognition.html" class="btn btn-brand text-nowrap"><i class="bi bi-plus-lg"></i> Give</a>
          </div>
        </div>
        <div id="feed" style="max-width:820px"><div class="text-center text-muted py-5">Loading...</div></div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/recognition.js"></script>
</body>
</html>
