<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Register - RecognitionHub</title>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4">
      <div class="text-center mb-4">
        <a href="index.html" class="text-decoration-none"><h4 class="text-brand fw-bold"><i class="bi bi-trophy-fill me-2"></i>RecognitionHub</h4></a>
        <p class="text-muted mb-0">Create your employee account</p>
      </div>
      <div id="alertBox"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="name">Full name</label>
          <input type="text" class="form-control" id="name" name="name" required minlength="2">
          <div class="invalid-feedback">Please enter your name.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="row">
          <div class="col-6 mb-3">
            <label class="form-label" for="employeeId">Employee ID</label>
            <input type="text" class="form-control" id="employeeId" name="employeeId" required>
            <div class="invalid-feedback">Required.</div>
          </div>
          <div class="col-6 mb-3">
            <label class="form-label" for="department">Department</label>
            <input type="text" class="form-control" id="department" name="department" required>
            <div class="invalid-feedback">Required.</div>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="6">
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required>
          <div class="invalid-feedback">Passwords must match.</div>
        </div>
        <button type="submit" class="btn btn-brand w-100">Create account</button>
      </form>
      <p class="text-center mt-3 mb-0">Already registered? <a href="login.html">Login</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
