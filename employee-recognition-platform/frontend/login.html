<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Login - RecognitionHub</title>
</head>
<body>
  <div class="auth-wrapper">
    <div class="card auth-card p-4">
      <div class="text-center mb-4">
        <a href="index.html" class="text-decoration-none"><h4 class="text-brand fw-bold"><i class="bi bi-trophy-fill me-2"></i>RecognitionHub</h4></a>
        <p class="text-muted mb-0">Sign in to your account</p>
      </div>
      <div id="alertBox"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" name="email" required>
          <div class="invalid-feedback">Please enter a valid email.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" name="password" required minlength="6">
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <button type="submit" class="btn btn-brand w-100">Login</button>
      </form>
      <p class="text-center mt-3 mb-0">No account? <a href="register.html">Register</a></p>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
