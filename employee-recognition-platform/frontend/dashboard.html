<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Dashboard - RecognitionHub</title>
</head>
<body data-page="dashboard">
  <div id="navbar-container"></div>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 d-none d-md-block sidebar" id="sidebar-container"></aside>
      <main class="col-md-9 col-lg-10 p-3 p-md-4">
        <div id="alertBox"></div>
        <h3 class="fw-bold mb-0">Welcome back, <span id="welcomeName"></span> 👋</h3>
        <p class="text-muted mb-4" id="deptText"></p>

        <div class="row g-3 mb-4">
          <div class="col-6 col-xl-3"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-primary-subtle text-primary"><i class="bi bi-award"></i></div>
            <div><div class="stat-value" id="statCount">-</div><div class="text-muted small">Recognitions received</div></div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-warning-subtle text-warning"><i class="bi bi-coin"></i></div>
            <div><div class="stat-value" id="statPoints">-</div><div class="text-muted small">Recognition points</div></div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-success-subtle text-success"><i class="bi bi-gift"></i></div>
            <div><div class="stat-value" id="statGiven">-</div><div class="text-muted small">Recognitions given</div></div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card stat-card"><div class="card-body d-flex align-items-center gap-3">
            <div class="icon-box bg-danger-subtle text-danger"><i class="bi bi-stars"></i></div>
            <div><div class="stat-value" id="statAchievements">-</div><div class="text-muted small">Achievements</div></div></div></div></div>
        </div>

        <div class="row g-4">
          <div class="col-lg-7">
            <div class="card mb-4">
              <div class="card-header d-flex justify-content-between align-items-center">
                Recent recognitions <a href="give-recognition.html" class="btn btn-sm btn-brand"><i class="bi bi-plus-lg"></i> Give</a>
              </div>
              <div class="card-body pt-0" id="recentList"><p class="text-muted my-3">Loading...</p></div>
            </div>
            <div class="card">
              <div class="card-header">Achievements</div>
              <div class="card-body" id="achievementList"></div>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="card">
              <div class="card-header">Notifications</div>
              <div class="card-body p-2" id="notificationList"><p class="text-muted m-3">Loading...</p></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
