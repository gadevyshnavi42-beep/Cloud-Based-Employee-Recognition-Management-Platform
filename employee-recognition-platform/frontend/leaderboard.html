<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Leaderboard - RecognitionHub</title>
</head>
<body data-page="leaderboard">
  <div id="navbar-container"></div>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 d-none d-md-block sidebar" id="sidebar-container"></aside>
      <main class="col-md-9 col-lg-10 p-3 p-md-4">
        <div id="alertBox"></div>
        <h3 class="fw-bold mb-4"><i class="bi bi-trophy text-warning me-2"></i>Leaderboard</h3>
        <div class="card"><div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light"><tr>
              <th>Rank</th><th>Employee</th><th>Department</th><th>Total points</th><th>Recognitions</th>
            </tr></thead>
            <tbody id="leaderboardBody"><tr><td colspan="5" class="text-center text-muted py-4">Loading...</td></tr></tbody>
          </table>
        </div></div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
