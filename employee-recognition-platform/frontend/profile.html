<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <title>Profile - RecognitionHub</title>
</head>
<body data-page="profile">
  <div id="navbar-container"></div>
  <div class="container-fluid">
    <div class="row">
      <aside class="col-md-3 col-lg-2 d-none d-md-block sidebar" id="sidebar-container"></aside>
      <main class="col-md-9 col-lg-10 p-3 p-md-4">
        <div id="alertBox"></div>
        <div id="profileContent"><p class="text-muted">Loading...</p></div>

        <!-- Edit profile modal (own profile only) -->
        <div class="modal fade" id="editProfileModal" tabindex="-1">
          <div class="modal-dialog"><div class="modal-content">
            <form id="editProfileForm" novalidate>
              <div class="modal-header"><h5 class="modal-title">Edit profile</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
              <div class="modal-body">
                <div id="editAlert"></div>
                <div class="mb-3"><label class="form-label" for="pname">Name</label>
                  <input type="text" class="form-control" id="pname" name="name" required minlength="2">
                  <div class="invalid-feedback">Name is required.</div></div>
                <div class="mb-3"><label class="form-label" for="pdept">Department</label>
                  <input type="text" class="form-control" id="pdept" name="department" required>
                  <div class="invalid-feedback">Department is required.</div></div>
                <div class="mb-3"><label class="form-label" for="ppass">New password <small class="text-muted">(optional)</small></label>
                  <input type="password" class="form-control" id="ppass" name="password" minlength="6">
                  <div class="invalid-feedback">At least 6 characters.</div></div>
                <div class="mb-3"><label class="form-label" for="pimg">Profile picture <small class="text-muted">(max 2 MB)</small></label>
                  <input type="file" class="form-control" id="pimg" name="profileImage" accept="image/png,image/jpeg,image/gif,image/webp"></div>
              </div>
              <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-brand">Save changes</button>
              </div>
            </form>
          </div></div>
        </div>
      </main>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
